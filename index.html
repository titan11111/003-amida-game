<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>あみだの試練</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
    <meta property="og:title" content="あみだの試練">
    <meta property="og:description" content="スマホ・PCのブラウザで遊べる無料ゲームです。インストール不要！">
    <meta property="og:url" content="https://titan11111.github.io/003-amida-game/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
</head>
<body>
  <div id="screen">
    <button id="mute-btn" class="icon-btn" aria-label="音声切替" type="button">🔊</button>

    <header id="hud" class="hidden">
      <div class="hud-cell"><span class="hud-ico">⚔</span><span id="hud-level">1</span></div>
      <div class="hud-cell"><span class="hud-ico">✦</span><span id="hud-score">0</span></div>
      <div class="hud-cell" id="hud-lives">♥♥♥</div>
    </header>

    <!-- TAP TO START -->
    <section id="title-screen" class="panel">
      <div class="crest">⚜</div>
      <h1>あみだの試練</h1>
      <p class="tagline">運命の道を辿れ</p>
      <button id="start-btn" class="medieval-btn primary" type="button">TAP TO START</button>
    </section>

    <!-- 冒険者選択 -->
    <section id="select-screen" class="panel hidden">
      <h2>冒険者</h2>
      <div id="char-grid">
        <button class="char-card" data-char="0" type="button">
          <img src="images/char1.webp" alt="" width="120" height="82">
          <span>影</span>
        </button>
        <button class="char-card" data-char="1" type="button">
          <img src="images/char2.webp" alt="" width="120" height="82">
          <span>剣</span>
        </button>
        <button class="char-card" data-char="2" type="button">
          <img src="images/char3.webp" alt="" width="120" height="82">
          <span>祈</span>
        </button>
      </div>
    </section>

    <!-- あみだ本体 -->
    <section id="play-screen" class="hidden">
      <div id="canvas-frame">
        <canvas id="game-canvas"></canvas>
        <div id="scroll-hint" class="hidden" aria-hidden="true">↕</div>
      </div>
      <div id="start-gates" class="hidden">
        <button class="gate-btn" data-start="1" type="button">Ⅰ</button>
        <button class="gate-btn" data-start="2" type="button">Ⅱ</button>
        <button class="gate-btn" data-start="3" type="button">Ⅲ</button>
        <button class="gate-btn" data-start="4" type="button">Ⅳ</button>
      </div>
    </section>

    <!-- 結果 -->
    <section id="result-screen" class="panel overlay hidden">
      <img id="result-img" src="images/treasure.webp" alt="">
      <p id="result-delta"></p>
      <div class="btn-row">
        <button id="next-btn" class="medieval-btn primary" type="button">次へ</button>
        <button id="retry-btn" class="medieval-btn" type="button">再挑戦</button>
      </div>
    </section>

    <!-- 終了 -->
    <section id="end-screen" class="panel overlay hidden">
      <div class="crest">⚜</div>
      <h2 id="end-title">終焉</h2>
      <p id="end-score"></p>
      <button id="restart-btn" class="medieval-btn primary" type="button">はじめから</button>
    </section>
  </div>

  <audio id="bgm" src="sounds/bgm.m4a" loop preload="auto"></audio>
  <script src="script.js"></script>
</body>
</html>
